<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Plugin Atlas · 插件能力图谱</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">Plugin Atlas</div>
      <div id="source" class="status" role="status">正在连接服务</div>
      <div class="toolbar-actions">
        <label
          >主题
          <select id="theme" aria-label="主题">
            <option value="system">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select></label
        ><button id="reload" type="button">重新加载</button>
      </div>
      <form id="search">
        <label class="searchbox"
          ><span class="sr-only">搜索插件或能力</span
          ><input id="query" placeholder="搜索插件或能力" autocomplete="off" /></label
        ><select id="mode" aria-label="检索模式">
          <option value="hybrid">混合检索</option>
          <option value="fulltext">全文检索</option>
          <option value="semantic">语义检索</option></select
        ><button type="submit">搜索插件</button
        ><label class="check"
          ><input type="checkbox" id="github-only" /> 包含仅 GitHub <span id="github-count"></span
        ></label>
      </form>
      <div id="results" hidden></div>
    </header>
    <main>
      <section class="explorer" aria-label="能力目录与分支图">
        <div class="section-heading">
          <div>
            <h1 id="view-title">能力目录</h1>
            <p id="counts">浏览分类、分支与插件</p>
          </div>
          <div class="view-tabs" role="tablist" aria-label="主视图">
            <button type="button" id="tab-catalog" role="tab" aria-selected="true">能力目录</button>
            <button type="button" id="tab-graph" role="tab" aria-selected="false">分支图</button>
          </div>
        </div>
        <div id="graphwrap">
          <div id="graph" role="tree" aria-label="插件能力目录">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
          </div>
          <div id="branch-graph-view" hidden>
            <div class="graph-toolbar">
              <label
                >分叉族
                <input id="graph-family" list="graph-family-list" placeholder="分支或插件 id" autocomplete="off"
              /></label>
              <datalist id="graph-family-list"></datalist>
              <button type="button" id="graph-load">查看</button>
              <label class="check"><input type="checkbox" id="graph-expand" /> 展开全部</label>
              <span id="graph-meta" class="muted"></span>
            </div>
            <div id="branch-graph" class="branch-graph"><p class="muted">选择一个分叉族，查看 git 式分支图。</p></div>
          </div>
        </div>
      </section>
      <section id="detail" aria-live="polite">
        <div class="empty">
          <h2>选择一个节点</h2>
          <p>从左侧能力目录选择分类、分支或插件，或打开分支图查看分叉关系。</p>
        </div>
      </section>
    </main>
    <script src="/vendor/marked.umd.js"></script>
    <script src="/vendor/purify.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
